name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Générer le tag d'image
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            tmodibo/devops-starter-kit:${{ steps.meta.outputs.tag }}
            tmodibo/devops-starter-kit:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurer l'accès au cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > ~/.kube/config

      - name: Déployer la nouvelle image
        run: |
          kubectl set image deployment/api api=tmodibo/devops-starter-kit:${{ needs.build-and-push.outputs.image_tag }}
          kubectl rollout status deployment/api --timeout=120s