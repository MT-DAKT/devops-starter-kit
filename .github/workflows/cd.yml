name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Générer le tag d'image
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            tmodibo/devops-starter-kit:${{ steps.meta.outputs.tag }}
            tmodibo/devops-starter-kit:latest

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Met à jour le tag d'image dans le manifest
        run: |
          sed -i "s|image: tmodibo/devops-starter-kit:.*|image: tmodibo/devops-starter-kit:${{ needs.build-and-push.outputs.image_tag }}|" k8s/base/deployment.yaml

      - name: Commit et push le changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/deployment.yaml
          git commit -m "chore: déploie l'image ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
