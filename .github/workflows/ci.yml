name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: ./app
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: ./app
        run: ruff check .

      - name: Tests (pytest)
        working-directory: ./app
        run: pytest -v

      - name: Build de l'image pour le scan
        run: docker build -t scan-target:latest ./app

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: app/.trivyignore
