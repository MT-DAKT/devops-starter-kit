apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-starter-kit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MT-DAKT/devops-starter-kit.git
    targetRevision: main
    path: helm/devops-starter-kit
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
