- name: Installer et configurer k3s
  hosts: k3s_server
  become: true

  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets de base
      apt:
        name:
          - curl
          - ufw
        state: present

    - name: Installer k3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Configurer le SAN TLS pour l'accès via l'IP publique
      copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          tls-san:
            - "{{ inventory_hostname }}"
      notify: Redémarrer k3s

    - name: Appliquer immédiatement le redémarrage si nécessaire
      meta: flush_handlers

    - name: Attendre que k3s soit prêt
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 60

    - name: Configurer le firewall (SSH, HTTP, HTTPS)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
        - "6443"   # port API Kubernetes

    - name: Activer le firewall
      ufw:
        state: enabled
        policy: deny

    - name: Récupérer le kubeconfig généré par k3s
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./kubeconfig
        flat: true

    - name: Remplacer 127.0.0.1 par l'IP publique dans le kubeconfig local
      delegate_to: localhost
      become: false
      replace:
        path: ./kubeconfig
        regexp: '127\.0\.0\.1'
        replace: "{{ inventory_hostname }}"

  handlers:
    - name: Redémarrer k3s
      systemd:
        name: k3s
        state: restarted
